<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    html{
      box-sizing: border-box;
    }
    *, *::before, *::after{
      box-sizing: inherit;
    }

    html{
      border: 4px solid purple;
      height: 100%;
    }
    body{
      border: 4px solid blue;
      height: 100%;
      margin: 0;
    }
    div{
      border: 4px solid yellow;
      height: 100%;
      padding: 20px;
    }
  </style>

</head>
<body>
  <div>content</div>
</body>
</html>
