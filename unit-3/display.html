<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p{
      display: inline;
      border: 5px solid black;
    }

    /* display properties */
    div{
      background-color: brown;
      height: 50px;
      width: 300px;
      display: inline-block;
      /* change and see the difference */
    }
    span{
      background-color: blueviolet;
      height: 50px;
      width: 300px;
      display: block;
    }
  </style>
</head>
<body>
  <p>Book</p>
  <p>Travel</p>

  <br><br>
  <!-- display properties -->
   <div>Block element</div>
   <div>Block element</div>
   <span>inline element</span>
   <span>inline element</span>
</body>
</html>

the width and height have no work in the inline element
