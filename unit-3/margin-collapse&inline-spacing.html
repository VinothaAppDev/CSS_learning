<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .d1, .d2{
      background-color: blue;
      padding: 20px;
      width: 80px;
      margin: 10px;      
    }

    .s1, .s2{
      background-color: orange;
      width: 80px;    
    }

    .d1{
      margin-bottom: 0;
    }

    .d2{
      margin-top: 0;
    }

    .s2{
      margin-left: -5px;
    }
  </style>
</head>
<body>
  <div class="d1">Block 1</div>
  <div class="d2">Block 2</div>
  <span class="s1">Inline 1</span>
  <span class="s2">Inline 2</span>

  <!-- 
  a little space between the 2 span
  rectified when
  <span class="s1">Inline 1</span><span class="s2">Inline 2</span>
  but not practical 
  so do in css
  -->
</body>
</html>
