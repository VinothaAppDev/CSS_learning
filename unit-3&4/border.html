<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p{
      /* Shorthand */
      border: 5px solid black;
      /* Longhand */
      border-width: 5px;
      border-style: solid;
      border-color: black;
    }
  </style>
</head>
<body>
  <p>hello world</p>
</body>
</html>

<!-- 
Border

-- Creates a border style around the padding box

-- If no padding exists, the border is placed around the content box

border-width  ----- <length> or keyword values

example:

border-width: 4px;
border-width: 1.2rem;
border-width: thin;
border-width: medium;
border-width: thick;

--- border-width also have shorthand 
border-bottom-width
border-left-width
border-right-width
border-top-width

https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/border-width

border-color ----- with any 3 color values (rbg, hex, keyword)

border-style ----- only with keyword
none
hidden
dotted
solid
double
groove
ridge
inset
outset
-->
